name: Premium Calendar
description: Adds an Event content type and a Calendar layout block.
type: module
core_version_requirement: ^9 || ^10 || ^11
version: '1.2'
package: Drupal Premium

dependencies:
  - core:layout_builder
  - color_field:color_field
  - date_recur:date_recur
  - date_recur_modular:date_recur_modular
  - fullcalendar:fullcalendar
  - premium_tools:premium_layout_builder_restrictions
  - styles:styles

interface translation project: premium_calendar
interface translation server pattern: modules/contrib/premium_calendar/translations/%language.po
